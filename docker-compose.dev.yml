version: '3.8'

services:
  agent-demo:
    build:
      context: ./services/agent_demo
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - LOG_LEVEL=debug
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    volumes:
      - ./services/agent_demo/src:/app/src:ro
      - ./services/agent_demo/package.json:/app/package.json:ro
    depends_on:
      - jaeger
    networks:
      - microservices-network
    command: npm run dev

  agent-custom:
    build:
      context: ./services/agent_custom
      dockerfile: Dockerfile.dev
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - LOG_LEVEL=debug
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - GATEWAY_URL=http://mock-gateway:1080/api/test
      - GATEWAY_API_KEY=demo-api-key-12345
    volumes:
      - ./services/agent_custom/src:/app/src:ro
      - ./services/agent_custom/package.json:/app/package.json:ro
    depends_on:
      - jaeger
      - mock-gateway
    networks:
      - microservices-network
    command: npm run dev

  jaeger:
    image: jaegertracing/all-in-one:1.51
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - microservices-network

  mock-gateway:
    image: mockserver/mockserver:5.15.0
    ports:
      - "1080:1080"
    environment:
      - MOCKSERVER_INITIALIZATION_JSON_PATH=/config/expectations.json
    volumes:
      - ./mock-gateway/expectations.json:/config/expectations.json:ro
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge
